name: flutter_application_1
description: Laboratorio 09 individual - interfaz móvil de Max.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/max/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato.ttf
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans.ttf

